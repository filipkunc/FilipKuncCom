<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nelinka — World Workshop</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#132024;color:#e8efe3;font:14px system-ui}
    header{height:44px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #34454b}
    header span{margin-right:auto;color:#b0c3c2}button,label{background:#2a3d43;color:inherit;border:0;padding:6px 12px;cursor:pointer;font:inherit}
    #glcanvas{display:block;width:100vw;height:calc(100vh - 44px);outline:none}
    #file{display:none}#notice{position:absolute;bottom:8px;left:240px;background:#132024;padding:8px;display:none}
  </style>
  <link rel="stylesheet" href="shared.css?v=a5c6c5483d7c">
</head>
<body class="loading">
  <header><strong>NELINKA</strong><span>World Workshop</span>
    <button id="export">Export saved JSON</button><button id="import" onclick="document.getElementById('file').click()">Import JSON</button><input id="file" type="file" accept=".json,application/json">
  </header>
  <canvas id="glcanvas" tabindex="0" aria-label="Nelinka level editor and game"></canvas>
  <div id="loading" role="status" aria-live="polite">
        <p id="loading-label">Loading the workshop…</p>
        <progress id="loading-progress" aria-labelledby="loading-label"></progress>
        <p id="loading-detail">The first visit may take a moment.</p>
        <button id="loading-retry" hidden>Try again</button>
      </div>
  <output id="notice"></output>
  <script src="storage.js?v=a5c6c5483d7c"></script>
  <script type="module" src="loader.js?v=a5c6c5483d7c"></script>
</body>
</html>
